<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500;1,600&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#dfeada;
    --sky-bottom:#f4eeda;
    --soil:#4a3728;
    --soil-light:#5f4632;
    --bark:#5c4433;
    --bark-dark:#432f22;
    --leaf-1:#2d4a1e;
    --leaf-2:#3e6b28;
    --leaf-3:#6b9c3f;
    --grass-back:#7fae4d;
    --grass-front:#4c7a2e;
    --gold:#d9a441;
    --ink:#2b2418;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    height:100%;
    overflow:hidden;
    background:var(--sky-bottom);
  }

  .scene{
    position:relative;
    width:100%;
    height:100vh;
    background:linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-bottom) 70%);
  }

  .sun{
    position:absolute;
    top:8%;
    right:10%;
    width:90px;
    height:90px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fff6da, var(--gold) 70%);
    box-shadow:0 0 60px 20px rgba(217,164,65,0.25);
    animation:glow 6s ease-in-out infinite;
  }

  @keyframes glow{
    0%,100%{ box-shadow:0 0 60px 20px rgba(217,164,65,0.20); }
    50%{ box-shadow:0 0 80px 30px rgba(217,164,65,0.35); }
  }

  .seed{
    position:absolute;
    bottom:22%;
    width:5px;
    height:5px;
    border-radius:50%;
    background:var(--gold);
    opacity:0;
    animation:drift 8s ease-in infinite;
  }

  @keyframes drift{
    0%{ opacity:0; transform:translate(0,0); }
    10%{ opacity:0.6; }
    90%{ opacity:0.3; }
    100%{ opacity:0; transform:translate(var(--dx,20px), -260px); }
  }

  .hill{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:9%;
    background:linear-gradient(to bottom, var(--soil-light), var(--soil));
  }

  .oak{
    position:absolute;
    bottom:9%;
    left:50%;
    transform:translateX(-50%);
    height:min(44vh, 380px);
    width:auto;
    overflow:visible;
  }

  .trunk, .branch{
    fill:none;
    stroke:var(--bark);
    stroke-linecap:round;
    stroke-width:14;
    stroke-dasharray:520;
    stroke-dashoffset:520;
    animation:grow-trunk 1.6s ease-out forwards;
  }
  .branch{ stroke-width:9; stroke:var(--bark-dark); stroke-dasharray:220; stroke-dashoffset:220; }
  .branch.b1{ animation:grow-branch1 1.1s ease-out 0.9s forwards; }
  .branch.b2{ animation:grow-branch2 1.1s ease-out 1.1s forwards; }

  @keyframes grow-trunk{ to{ stroke-dashoffset:0; } }
  @keyframes grow-branch1{ to{ stroke-dashoffset:0; } }
  @keyframes grow-branch2{ to{ stroke-dashoffset:0; } }

  .canopy path{
    opacity:0;
    transform:scale(0.2);
    transform-box:fill-box;
    transform-origin:50% 100%;
    animation:bloom 0.9s cubic-bezier(.34,1.4,.64,1) forwards;
  }
  .canopy path:nth-child(1){ animation-delay:1.5s; }
  .canopy path:nth-child(2){ animation-delay:1.65s; }
  .canopy path:nth-child(3){ animation-delay:1.8s; }
  .canopy path:nth-child(4){ animation-delay:1.9s; }
  .canopy path:nth-child(5){ animation-delay:2.0s; }
  .canopy path:nth-child(6){ animation-delay:2.1s; }

  @keyframes bloom{
    to{ opacity:1; transform:scale(1); }
  }

  .canopy{
    animation:sway 6s ease-in-out 2.6s infinite;
    transform-box:fill-box;
    transform-origin:50% 100%;
  }

  @keyframes sway{
    0%,100%{ transform:rotate(-0.6deg); }
    50%{ transform:rotate(0.6deg); }
  }

  .grass-field{
    position:absolute;
    bottom:9%;
    left:0;
    width:100%;
    height:8%;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    padding:0 2%;
    pointer-events:none;
  }

  .blade{
    width:8px;
    border-radius:4px 4px 0 0;
    clip-path:polygon(50% 0%, 85% 100%, 15% 100%);
    transform-origin:bottom center;
    animation:sprout 0.7s ease-out forwards, blade-sway 3.2s ease-in-out infinite;
    animation-fill-mode:both, none;
  }

  @keyframes sprout{
    from{ transform:scaleY(0) rotate(var(--rot, 0deg)); }
    to{ transform:scaleY(1) rotate(var(--rot, 0deg)); }
  }

  @keyframes blade-sway{
    0%,100%{ rotate: calc(var(--rot, 0deg) - 4deg); }
    50%{ rotate: calc(var(--rot, 0deg) + 4deg); }
  }

  .content{
    position:absolute;
    top:9%;
    left:50%;
    transform:translateX(-50%);
    width:min(90%, 900px);
    text-align:center;
    z-index:20;
    opacity:0;
    animation:rise 1s ease-out 2.6s forwards;
  }

  @keyframes rise{
    from{ opacity:0; transform:translateX(-50%) translateY(10px); }
    to{ opacity:1; transform:translateX(-50%) translateY(0); }
  }

  .content h1{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(2rem, 5vw, 3.4rem);
    color:var(--ink);
    margin:0 0 0.4rem 0;
    letter-spacing:-0.01em;
    text-shadow:0 0 24px var(--sky-bottom), 0 0 40px var(--sky-bottom);
  }

  .content h1 em{
    color:var(--leaf-1);
    font-style:italic;
  }

  .content p{
    font-family:'Work Sans', sans-serif;
    font-weight:500;
    font-size:0.95rem;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--bark-dark);
    opacity:0.85;
    margin:0;
    text-shadow:0 0 18px var(--sky-bottom), 0 0 30px var(--sky-bottom);
  }

  @media (max-width: 640px){
    .oak{ height:min(30vh, 260px); }
    .content{ top:7%; }
    .content h1{ font-size:clamp(1.7rem, 8vw, 2.4rem); }
  }


</style>
</head>
<body>

<div class="scene">

  <div class="sun"></div>
  <div id="seeds"></div>
  <div class="hill"></div>

  <svg class="oak" viewBox="0 0 400 420" xmlns="http://www.w3.org/2000/svg">
    <path class="trunk" d="M200,420 C196,360 204,320 199,270 C195,225 205,200 200,160" />
    <path class="branch b1" d="M199,270 C170,255 150,235 128,215" />
    <path class="branch b2" d="M205,220 C232,205 252,190 268,168" />

    <g class="canopy">
      <path fill="var(--leaf-1)" d="M200,60 C150,55 118,95 122,140 C90,150 78,190 105,220 C95,255 125,285 165,280 C180,300 215,300 232,282 C270,290 300,258 288,222 C312,196 300,155 268,142 C270,100 232,64 200,60 Z"/>
      <path fill="var(--leaf-2)" d="M150,110 C128,120 118,148 132,170 C118,188 126,212 150,218 C150,240 174,254 194,244 C210,254 230,244 232,224 C252,222 262,198 248,180 C256,158 242,134 218,132 C214,112 192,100 172,106 C165,104 156,106 150,110 Z" opacity="0.95"/>
      <path fill="var(--leaf-3)" d="M175,150 C160,156 154,174 164,188 C156,200 164,216 180,218 C182,232 200,240 212,230 C224,236 238,226 236,212 C248,208 252,190 240,178 C244,162 232,148 216,148 C210,138 190,140 175,150 Z" opacity="0.9"/>
    </g>
  </svg>

  <div class="grass-field" id="grassField"></div>

  <div class="content">
    <h1>Something is <em>growing</em>.</h1>
    <p>Coming soon</p>
  </div>

</div>

<script>
  // grass blades
  const field = document.getElementById('grassField');
  const bladeCount = 60;
  const colors = ['var(--grass-back)', 'var(--grass-front)'];
  for (let i = 0; i < bladeCount; i++) {
    const blade = document.createElement('div');
    blade.className = 'blade';
    const height = 22 + Math.random() * 26;
    const rotate = (Math.random() * 16) - 8;
    const delay = 1.4 + Math.random() * 1.1;
    const duration = 0.5 + Math.random() * 0.4;
    const swayDuration = 2.6 + Math.random() * 1.6;
    const color = colors[Math.floor(Math.random() * colors.length)];
    blade.style.height = height + 'px';
    blade.style.background = color;
    blade.style.setProperty('--rot', rotate + 'deg');
    blade.style.animationDelay = delay + 's, ' + delay + 's';
    blade.style.animationDuration = duration + 's, ' + swayDuration + 's';
    field.appendChild(blade);
  }

  // drifting seeds
  const seedLayer = document.getElementById('seeds');
  for (let i = 0; i < 10; i++) {
    const seed = document.createElement('div');
    seed.className = 'seed';
    seed.style.left = (10 + Math.random() * 80) + '%';
    seed.style.setProperty('--dx', (Math.random() * 60 - 30) + 'px');
    seed.style.animationDelay = (Math.random() * 8) + 's';
    seed.style.animationDuration = (7 + Math.random() * 4) + 's';
    seedLayer.appendChild(seed);
  }
</script>

</body>
</html>
